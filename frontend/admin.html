<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinRAG Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    
    <!-- Navbar -->
    <nav class="bg-gray-900 text-white p-4 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <h1 class="font-bold text-xl"><i class="fas fa-database text-blue-400 mr-2"></i> FinRAG Admin Dashboard</h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="index.html" class="hover:text-blue-400"><i class="fas fa-comments"></i> Go to Chat</a>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-6xl mx-auto p-6 mt-6">
        
        <!-- Manual Ingest Box -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-8">
            <h2 class="text-lg font-bold mb-4 border-b pb-2"><i class="fas fa-upload text-gray-500 mr-2"></i> Ingest New Document</h2>
            <div class="flex gap-4">
                <input type="text" id="manual-file" class="flex-1 border border-gray-300 rounded-md p-2" placeholder="e.g. concall-transcripts/apollo/2025_Aug_2025_Transcript.pdf">
                <button onclick="ingestManual()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-md font-semibold transition">
                    Trigger Ingestion
                </button>
            </div>
            <p class="text-xs text-gray-500 mt-2">Enter the exact path in MinIO to start the OpenKB compilation pipeline.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Concalls Section -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="bg-gray-100 p-4 border-b border-gray-200">
                    <h2 class="font-bold text-lg"><i class="fas fa-phone-alt text-gray-600 mr-2"></i> Concall Transcripts</h2>
                </div>
                <ul id="concall-list" class="divide-y divide-gray-100">
                    <li class="p-8 text-center text-gray-400">Loading documents...</li>
                </ul>
            </div>

            <!-- Annual Reports Section -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="bg-gray-100 p-4 border-b border-gray-200">
                    <h2 class="font-bold text-lg"><i class="fas fa-book text-gray-600 mr-2"></i> Annual Reports</h2>
                </div>
                <ul id="annual-list" class="divide-y divide-gray-100">
                    <li class="p-8 text-center text-gray-400">Loading documents...</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        if (!sessionStorage.getItem('finrag_admin')) {
            window.location.href = 'login.html';
        }

        function logout() {
            sessionStorage.removeItem('finrag_admin');
            window.location.href = 'login.html';
        }

        async function loadDocuments() {
            try {
                const res = await fetch('/api/documents');
                const data = await res.json();
                
                renderList('concall-list', data.concalls);
                renderList('annual-list', data.annual_reports);
            } catch (e) {
                console.error("Failed to load documents", e);
            }
        }

        function renderList(elementId, items) {
            const ul = document.getElementById(elementId);
            ul.innerHTML = '';
            
            if (!items || items.length === 0) {
                ul.innerHTML = '<li class="p-4 text-gray-500 text-sm text-center">No documents found.</li>';
                return;
            }

            items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'p-4 flex justify-between items-center hover:bg-gray-50';
                
                const statusIcon = item.ingested 
                    ? '<i class="fas fa-check-circle text-green-500 text-lg" title="Ingested"></i>' 
                    : '<button onclick="ingest(\'' + item.name + '\')" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs px-3 py-1 rounded">Ingest</button>';
                
                li.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <i class="fas fa-file-pdf text-red-500"></i>
                        <span class="text-sm font-medium text-gray-700 truncate" title="${item.name}">${item.name}</span>
                    </div>
                    <div class="flex-shrink-0 ml-4">
                        ${statusIcon}
                    </div>
                `;
                ul.appendChild(li);
            });
        }

        async function ingest(filename) {
            alert(`Triggering ingestion for ${filename}... check backend logs.`);
            // In reality, this would POST to /api/ingest
        }

        async function ingestManual() {
            const val = document.getElementById('manual-file').value.trim();
            if(!val) return alert('Enter a filename');
            
            try {
                const res = await fetch('/api/ingest', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filename: val})
                });
                const data = await res.json();
                alert(data.message);
                loadDocuments();
            } catch(e) {
                alert("Error triggering ingestion");
            }
        }

        // Initialize
        loadDocuments();
    </script>
</body>
</html>
