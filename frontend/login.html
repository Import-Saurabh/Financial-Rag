<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - FinRAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Admin Login</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter admin password (admin)">
            </div>
            <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                Log In
            </button>
            <p id="error-msg" class="text-red-500 text-sm mt-2 text-center hidden">Invalid password.</p>
        </div>
        <div class="mt-4 text-center">
            <a href="index.html" class="text-blue-600 text-sm hover:underline">&larr; Back to Chat</a>
        </div>
    </div>

    <script>
        async function login() {
            const pwd = document.getElementById('password').value;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: pwd})
                });
                if(res.ok) {
                    sessionStorage.setItem('finrag_admin', 'true');
                    window.location.href = 'admin.html';
                } else {
                    document.getElementById('error-msg').classList.remove('hidden');
                }
            } catch(e) {
                alert("Server not responding");
            }
        }
    </script>
</body>
</html>
